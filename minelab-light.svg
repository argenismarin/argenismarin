  <text x="534" y="96" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.30s"><tspan fill="#c792ea">import</tspan><tspan fill="#e6edf3"> minelab </tspan><tspan fill="#c792ea">as</tspan><tspan fill="#e6edf3"> ml</tspan></text><text x="534" y="115.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.37s"></text><text x="534" y="135" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.44s"><tspan fill="#6f7f99"># Economía minera, VAN del proyecto</tspan></text><text x="534" y="154.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.51s"><tspan fill="#e6edf3">van = ml.</tspan><tspan fill="#82aaff">npv</tspan><tspan fill="#e6edf3">(rate=</tspan><tspan fill="#f78c6c">0.10</tspan><tspan fill="#e6edf3">,</tspan></text><text x="534" y="174" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.58s"><tspan fill="#e6edf3">    cashflows=[</tspan><tspan fill="#f78c6c">-100_000</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#f78c6c">30_000</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#f78c6c">45_000</tspan><tspan fill="#e6edf3">])</tspan></text><text x="534" y="193.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.65s"></text><text x="534" y="213" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.72s"><tspan fill="#6f7f99"># Voladura, fragmentación Kuz-Ram</tspan></text><text x="534" y="232.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.79s"><tspan fill="#e6edf3">x50 = ml.</tspan><tspan fill="#82aaff">kuz_ram_x50</tspan><tspan fill="#e6edf3">(powder_factor=</tspan><tspan fill="#f78c6c">0.5</tspan><tspan fill="#e6edf3">,</tspan></text><text x="534" y="252" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.86s"><tspan fill="#e6edf3">    rock_factor=</tspan><tspan fill="#f78c6c">8.0</tspan><tspan fill="#e6edf3">, charge_weight=</tspan><tspan fill="#f78c6c">150.0</tspan><tspan fill="#e6edf3">)</tspan></text><text x="534" y="271.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:0.93s"></text><text x="534" y="291" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:1.00s"><tspan fill="#6f7f99"># Procesamiento, recuperación por flotación</tspan></text><text x="534" y="310.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:1.07s"><tspan fill="#e6edf3">rec = ml.</tspan><tspan fill="#82aaff">flotation_recovery</tspan><tspan fill="#e6edf3">(feed_grade=</tspan><tspan fill="#f78c6c">1.2</tspan><tspan fill="#e6edf3">,</tspan></text><text x="534" y="330" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.8" xml:space="preserve" class="rise" style="animation-delay:1.14s"><tspan fill="#e6edf3">    concentrate_grade=</tspan><tspan fill="#f78c6c">28.0</tspan><tspan fill="#e6edf3">, tail_grade=</tspan><tspan fill="#f78c6c">0.15</tspan><tspan fill="#e6edf3">)</tspan></text>
