name: Actualizar perfil

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # PROFILE_TOKEN es opcional y permite contar también la actividad privada
      - name: Generar tarjetas
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generar serpiente de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#c2410c&color_dots=#ebedf0,#f6d7b8,#eeb07a,#d9773a,#a3410c
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2994a&color_dots=#161b22,#4a2f1a,#7a4a22,#c2742f,#f2c94c

      - name: Publicar en la rama output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Actualizar tarjetas del perfil"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
