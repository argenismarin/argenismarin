<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 692" width="1000" height="692" role="img" aria-label="Áreas de impacto">
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .rise { animation: rise 0.7s ease-out both; }
  </style>
  <rect x="0.5" y="0.5" width="999" height="691" rx="16" fill="#ffffff" stroke="#e2dccf"/>
  <g transform="translate(28 28)"><g class="rise" style="animation-delay:0.10s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#2563eb"/>
      <g transform="translate(20 24) scale(1.6)"><g fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M2 4h14v10H2z"/><path d="M6 18h6M9 14v4"/><path d="M18 8h4v12h-4z"/></g></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">01</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Full stack multientorno</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Apps para web, Windows, macOS, Linux,</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Android e iOS desde una sola base de</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">código, del backend a la interfaz.</text>
    </g></g><g transform="translate(348.6666666666667 28)"><g class="rise" style="animation-delay:0.19s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#b7791f" fill-opacity="0.06" stroke="#b7791f" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#b7791f"/>
      <g transform="translate(20 24) scale(1.6)"><g fill="none" stroke="#b7791f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16v-4M11.5 16V8M16 16v-6M20 16V5"/></g></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">02</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Ciencia de datos</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Análisis, modelos y tableros que</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">convierten los datos de la operación en</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">decisiones medibles.</text>
    </g></g><g transform="translate(669.3333333333334 28)"><g class="rise" style="animation-delay:0.28s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#c2410c" fill-opacity="0.06" stroke="#c2410c" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#c2410c"/>
      <g transform="translate(20 24) scale(1.6)"><g fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M2 19.5c3.5 0 4.5-6.5 6.5-10.5S11 4.5 12 4.5s2 1 3.5 4.5 3 10.5 6.5 10.5"/><circle cx="7" cy="16" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="15.5" cy="15" r="1"/></g></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">03</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Modelamiento estocástico</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Procesos estocásticos, simulación Monte</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Carlo y geoestadística para medir riesgo</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">e incertidumbre, llevados a aplicaciones.</text>
    </g></g><g transform="translate(28 246)"><g class="rise" style="animation-delay:0.37s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#0f766e" fill-opacity="0.06" stroke="#0f766e" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#0f766e"/>
      <g transform="translate(20 24) scale(1.6)"><g fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3.2 3.2M15.8 15.8L19 19M5 19l3.2-3.2M15.8 8.2L19 5"/><circle cx="12" cy="12" r="2.2"/></g></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">04</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Machine learning</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Modelos de clasificación, regresión y</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">visión, desde el diseño de funciones</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">hasta el despliegue en producción.</text>
    </g></g><g transform="translate(348.6666666666667 246)"><g class="rise" style="animation-delay:0.46s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#6d28d9" fill-opacity="0.06" stroke="#6d28d9" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#6d28d9"/>
      <g transform="translate(20 24) scale(1.6)"><g fill="none" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.2"/></g></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">05</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Visión artificial e hiperespectral</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Cámaras hiperespectrales y</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">multiespectrales de Living Optics, OpenCV</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">y YOLO, con funciones de machine learning</text><text x="22" y="186" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">a la medida.</text>
    </g></g><g transform="translate(669.3333333333334 246)"><g class="rise" style="animation-delay:0.55s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#b7791f" fill-opacity="0.06" stroke="#b7791f" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#b7791f"/>
      <g transform="translate(20 24) scale(1.6)"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="none" stroke="#b7791f" stroke-width="2" stroke-linejoin="round"/></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">06</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">IIoT y automatización industrial</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Sensores conectados con MQTT y Node-RED,</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">PLC Siemens y equipos Schneider Electric</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">en estaciones eléctricas.</text>
    </g></g><g transform="translate(28 464)"><g class="rise" style="animation-delay:0.64s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#2563eb"/>
      <g transform="translate(20 24) scale(1.6)"><g fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M10.8 7.2l-4.6 9.6M13.2 7.2l4.6 9.6M7.5 19h9"/></g></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">07</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Redes e infraestructura</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Redes, servidores Linux a nivel avanzado</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">y nube en AWS, Azure y Google Cloud, con</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">contenedores y despliegue continuo.</text>
    </g></g><g transform="translate(348.6666666666667 464)"><g class="rise" style="animation-delay:0.73s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#c2410c" fill-opacity="0.06" stroke="#c2410c" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#c2410c"/>
      <g transform="translate(20 24) scale(1.6)"><path d="M3 21 L16 8" stroke="#c2410c" stroke-width="2.4" stroke-linecap="round"/><path d="M8 2 Q22 2.5 22.5 16.5 Q18 6.5 8 2 Z" fill="#c2410c" stroke="#c2410c" stroke-width="1.2" stroke-linejoin="round"/></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">08</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Ingeniería que se programa</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Convierto los cálculos de minería y</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">metalurgia en código validado, con</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">pruebas y referencias, como en MineLab.</text>
    </g></g><g transform="translate(669.3333333333334 464)"><g class="rise" style="animation-delay:0.82s">
      <rect width="302.6666666666667" height="200" rx="14" fill="#0f766e" fill-opacity="0.06" stroke="#0f766e" stroke-opacity="0.35"/>
      <rect x="22" y="0" width="56" height="3" rx="1.5" fill="#0f766e"/>
      <g transform="translate(20 24) scale(1.6)"><g fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 4h16v11H10l-5 4.5V15H4z"/><path d="M8 8.5h8M8 11.5h5"/></g></g>
      <text x="280.6666666666667" y="40" text-anchor="end" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#5f6b7a">09</text>
      <text x="22" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">IA en la operación</text>
      <text x="22" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">Asistentes RAG que capacitan equipos y</text><text x="22" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">modelos de visión que convierten lo que</text><text x="22" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1f2937" fill-opacity="0.78">ve una cámara en decisiones.</text>
    </g></g>
